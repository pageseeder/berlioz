[versions]
cyclonedx = "3.2.4"
saxon = "12.5"
sonarqube = "7.3.0.8198"
gson = "2.14.0"
jackson = "2.22.2"
jakarta-json = "2.1.3"
javax-json = "1.1.4"
jspecify = "1.0.1"
junit-jupiter = "5.14.4"
junit-platform = "1.14.4"
parsson = "1.1.9"
servlet-api = "4.0.1"
slf4j = "2.0.18"
xmlwriter = "1.1.1"

[libraries]
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
jackson-core = { module = "com.fasterxml.jackson.core:jackson-core", version.ref = "jackson" }
jakarta-json-api = { module = "jakarta.json:jakarta.json-api", version.ref = "jakarta-json" }
javax-json-api = { module = "javax.json:javax.json-api", version.ref = "javax-json" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit-platform" }
parsson = { module = "org.eclipse.parsson:parsson", version.ref = "parsson" }
glassfish-javax-json = { module = "org.glassfish:javax.json", version.ref = "javax-json" }
glassfish-jakarta-json = { module = "org.glassfish:jakarta.json", version = "2.0.1" }
saxon-he = { module = "net.sf.saxon:Saxon-HE", version.ref = "saxon" }
servlet-api = { module = "javax.servlet:javax.servlet-api", version.ref = "servlet-api" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }
xmlwriter = { module = "org.pageseeder.xmlwriter:pso-xmlwriter", version.ref = "xmlwriter" }

[plugins]
cyclonedx = { id = "org.cyclonedx.bom", version.ref = "cyclonedx" }
sonarqube = { id = "org.sonarqube", version.ref = "sonarqube" }
jreleaser = { id = "org.jreleaser", version = "1.24.0" }
versions = { id = "com.github.ben-manes.versions", version = "0.49.0" }
